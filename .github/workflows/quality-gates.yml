# No lock file is committed, so the gate installs what a site requiring the bundle would get today.
name: Quality gates

on:
  push:
  pull_request:

jobs:
  gates:
    name: Lint and test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # The version the sites run on.
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none

      - name: Validate the composer file
        run: composer validate --strict

      - name: Install dependencies
        run: composer update --no-interaction --no-progress

      - name: Check the coding style
        run: vendor/bin/php-cs-fixer check --diff

      # Through xargs: with `-exec` GNU find reports zero even when the linter failed.
      - name: Lint PHP
        run: find src tests -name "*.php" -print0 | xargs -0 -n1 php -l

      # A bundle has no console: `TemplatesTest` compiles the templates, `KongtentBundleTest` boots a container.
      - name: Test
        run: vendor/bin/phpunit
